# Configuración para el análisis de calidad con SonarQube
sonar.projectKey=crud-productos-rails
sonar.projectName=CRUD Productos (Ruby on Rails)
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Código fuente y pruebas
sonar.sources=app,config,lib
sonar.tests=test
sonar.exclusions=config/credentials.yml.enc,config/master.key

# Reporte de cobertura generado por SimpleCov al correr "bin/rails test"
sonar.ruby.coverage.reportPaths=coverage/coverage.json

# Los archivos de configuración de Rails no son lógica de la aplicación; SimpleCov
# tampoco los mide. Se siguen analizando por bugs y code smells, solo se excluyen
# del cálculo de cobertura.
sonar.coverage.exclusions=config/**
